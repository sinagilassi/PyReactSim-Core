REFERENCES:
  REACTION-1:
    NAME: reaction 1
    BASIS: concentration
    REACTION: CH3COOH(l) + CH3OH(l) <=> C3H6O2(l) + H2O(l)
    PARAMETERS:
      - kf:
        name: reaction-rate-coefficient
        description: forward reaction rate coefficient
        value: 1.0e-6
        units: m3/mol.s
        symbol: kf
      - kr:
        name: reaction-rate-coefficient
        description: reverse reaction rate coefficient
        value: 2.0e-7
        units: m3/mol.s
        symbol: kr
    EXPRESSION:
      # concentration in mol/m3
      - c_acid = C["CH3COOH-l"]
      - c_meoh = C["CH3OH-l"]
      - c_meac = C["C3H6O2-l"]
      - c_h2o = C["H2O-l"]
      # reaction rate in mol/m3.s
      - rf = c_acid * c_meoh
      - rr = c_meac * c_h2o
      - r = kf * rf - kr * rr
