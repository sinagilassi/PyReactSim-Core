REFERENCES:
  REACTION-1:
    NAME: reaction 1
    BASIS: concentration
    UNIT: mol/m3
    REACTION: CH3COOH(l) + CH3OH(l) <=> C3H6O2(l) + H2O(l)
    PARAMETERS:
      k_f:
        name: reaction-rate-coefficient
        description: forward reaction rate coefficient
        value: 1.0e-6
        unit: m3/mol.s
        symbol: k_f
      k_r:
        name: reaction-rate-coefficient
        description: reverse reaction rate coefficient
        value: 2.0e-7
        unit: m3/mol.s
        symbol: k_r
    ARGS:
      T:
        value: 0.0
        unit: K
        symbol: T
      rho_B:
        value: 0.0
        unit: kg/m3
        symbol: rho_B
    RETURN:
      name: r1
      description: Artificial mild reversible rate for debugging liquid PBR behavior
      value: 0.0
      unit: mol/m3.s
      symbol: r1
      expression: r
    EXPRESSION:
      - c_acid = C["CH3COOH-l"]
      - c_meoh = C["CH3OH-l"]
      - c_meac = C["C3H6O2-l"]
      - c_h2o = C["H2O-l"]
      - rf = c_acid * c_meoh
      - rr = c_meac * c_h2o
      - r = rho_B * (kf * rf - kr * rr)
